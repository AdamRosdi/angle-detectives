<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drag the Arm - Angle Detectives</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header Navigation -->
  <header class="site-header">
    <div class="header-content">
      <a href="index.html" class="back-link">🏠 Home</a>
      <h1 class="logo">🧪 Drag the Arm</h1>
      <p class="tagline">Drag the red dot to change the angle.</p>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container">

    <section class="lab-card">
      <div class="lab-header">
        <h2>Drag the Arm</h2>
        <p class="instruction-text">Drag the red dot to change the angle.</p>
      </div>

      <!-- Live Visualizer -->
      <div class="lab-visualizer" id="lab-visualizer-box">
        <svg viewBox="0 0 300 300" id="lab-svg" class="lab-svg" aria-label="Interactive angle visualizer">
          <!-- Fixed Baseline (horizontal arm extending right from vertex) -->
          <line x1="150" y1="210" x2="260" y2="210" class="lab-line-base" />
          <!-- Angle Indicator Arc or Square Marker at Vertex -->
          <path id="lab-angle-indicator" d="" class="lab-indicator-path" />
          <!-- Rotating Arm -->
          <line x1="150" y1="210" x2="150" y2="100" id="lab-rotating-arm" class="lab-line-arm" />
          <!-- Vertex Circle -->
          <circle cx="150" cy="210" r="7" class="vertex-dot" />
          <!-- Interactive Red Dot Handle at the end of the rotating arm -->
          <circle cx="150" cy="100" r="16" id="drag-handle" class="drag-handle" role="button" aria-label="Drag handle to adjust angle" />
        </svg>

        <!-- Dynamic Type Label -->
        <div id="lab-type-badge" class="type-badge badge-green">
          Right angle
        </div>
      </div>

      <!-- Information Explanation -->
      <div class="lab-info-box" id="lab-info-box">
        <h3 id="lab-info-title">Right angle</h3>
        <p id="lab-info-desc">A right angle forms a perfect square corner!</p>
      </div>

    </section>

  </main>

  <footer class="site-footer">
    <p>Angle Detectives - Fun Maths for Year 4 Pupils</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
